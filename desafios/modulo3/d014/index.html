<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        caption {
            padding: 10px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            border: 1px solid black;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .cor {
            background-color: rgba(128, 128, 128, 0.722);
            color: white;
        }
    </style>
</head>
<body>

    <table>
        <caption>
            Grade de Notas
        </caption>
        <thead>
            <tr>
                <th rowspan="2" class="cor" scope="col">Área</th>
                <th rowspan="2" class="cor" scope="col">Disciplinas</th>
                <th colspan="2" class="cor" scope="colgroup">Notas</th>
                <th rowspan="2" class="cor" scope="col">Média</th>
            </tr>
            <tr>
                <td class="cor">Nota 1</td>
                <td class="cor">Nota 2</td>
            </tr>
        </thead>
            
        <tbody>
                <th rowspan="5" scope="rowgroup">Exatas</th>
                <tr> 
                    <td style="text-align: left;">Matemática</td> 
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td style="text-align: left;">Física</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td style="text-align: left;">Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td style="text-align: left;">Biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="4" class="cor" style="text-align: left;" scope="row">Média de Exatas</th>
                    <td class="cor">0.0</td>
                </tr>
                <tr>
                    <th rowspan="2" scope="rowgroup">Humanas</th>
                    <td style="text-align: left;">História</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td style="text-align: left;">Geografia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <th colspan="4" class="cor" style="text-align: left;" scope="row">Média de Humanas</th>
                    <td class="cor">0.0</td>
                </tr>

        </tbody>
    </table>

</body>
</html>
