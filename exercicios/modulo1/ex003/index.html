<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>
<body>
    <h1>Testando carga de imagens.</h1>
<hr>
    <p>Abaixo você vai ver uma imagem que esta na mesma pasta.</p>

    <img src="Logo HTML-200.webp" alt="Logo HTML5">
